name: flutterdev

services:
  flutterdev:
    image: flutterdev:local
    container_name: flutterdev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${BASE_IMAGE:-ubuntu:26.04}"
        FLUTTER_CHANNEL: "${FLUTTER_CHANNEL:-stable}"
        OPENCODE_CHANNEL: "${OPENCODE_CHANNEL:-stable}"
        NODE_CHANNEL: "${NODE_CHANNEL:-lts}"
        DEV_UID: "${DEV_UID}"
        DEV_GID: "${DEV_GID}"
        ANDROID_API_LEVEL: "${ANDROID_API_LEVEL:-36}"
        ANDROID_BUILD_TOOLS: "${ANDROID_BUILD_TOOLS:-36.0.0}"
        ANDROID_SYSTEM_IMAGE: "${ANDROID_SYSTEM_IMAGE:-system-images;android-36;google_apis;x86_64}"
        ANDROID_AVD_NAME: "${ANDROID_AVD_NAME}"
        ANDROID_ACCEPT_LICENSES: "${ANDROID_ACCEPT_LICENSES}"
        JDK_PACKAGE: "${JDK_PACKAGE:-openjdk-21-jdk}"
    init: true
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      HOME: /home/dev
      DEV_UID: "${DEV_UID}"
      DEV_GID: "${DEV_GID}"
      ANDROID_AVD_NAME: "${ANDROID_AVD_NAME}"
      WEB_CONTAINER_PORT: "${WEB_CONTAINER_PORT}"
      SSH_CONTAINER_PORT: "${SSH_CONTAINER_PORT}"
      SSH_ENABLED: "${SSH_ENABLED:-true}"
      DOCKER_NETWORK: "${DOCKER_NETWORK}"
      SEARXNG_MCP_URL: "${SEARXNG_MCP_URL}"
      PLAYWRIGHT_MCP_URL: "${PLAYWRIGHT_MCP_URL}"
      LOCAL_LLM_BASE_URL: "${LOCAL_LLM_BASE_URL}"
      LOCAL_LLM_MODEL: "${LOCAL_LLM_MODEL}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-}"
      OPENCODE_GO_BASE_URL: "${OPENCODE_GO_BASE_URL}"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      # Optional: create config/git/config from config.example,
      # then enable both the mount and the variable at the same time.
      # GIT_CONFIG_GLOBAL: /etc/flutterdev/gitconfig
    ports:
      - "${WEB_BIND_ADDRESS}:${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}"
      - "${SSH_BIND_ADDRESS}:${SSH_HOST_PORT}:${SSH_CONTAINER_PORT}"
    volumes:
      - ./workspace:/workspace
      - ./state/home:/home/dev
      - ./config/opencode:/home/dev/.config/opencode:ro
      - ./state/ssh:/var/lib/flutterdev/ssh
      - ./state/access:/etc/flutterdev/access:ro
      # - ./config/git/config:/etc/flutterdev/gitconfig:ro
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    shm_size: "2g"
    pids_limit: 4096
    mem_limit: 16g
    cpus: 8
    networks:
      - devnet
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  devnet:
    external: true
    name: "${DOCKER_NETWORK}"
